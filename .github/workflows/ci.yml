name: Verificación de macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Rust y paquete ARM64
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Descargar código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Preparar Rust
        run: |
          test "$(uname -m)" = arm64
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Formato, Clippy y pruebas
        run: ./scripts/check.sh
      - name: Compilar y validar la aplicación
        run: |
          ./scripts/bundle.sh
          lipo dist/AMStats.app/Contents/MacOS/amstats -verify_arch arm64
          codesign --verify --strict dist/AMStats.app
